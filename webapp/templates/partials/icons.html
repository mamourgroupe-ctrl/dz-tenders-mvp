{# Inline SVG icon set — no external requests, CSP-safe. #}
{% macro icon(name, size=18, extra="") -%}
<svg class="icon {{ extra }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == "search" -%}
    <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path>
  {%- elif name == "pin" -%}
    <path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z"></path><circle cx="12" cy="10" r="2.4"></circle>
  {%- elif name == "calendar" -%}
    <rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M8 3v4M16 3v4M3.5 10h17"></path>
  {%- elif name == "lock" -%}
    <rect x="4.5" y="10" width="15" height="10.5" rx="2"></rect><path d="M8 10V7.5a4 4 0 0 1 8 0V10"></path>
  {%- elif name == "building" -%}
    <path d="M4 21V6.5L12 3l8 3.5V21"></path><path d="M9 21v-5h6v5M8 9h2M14 9h2M8 12.5h2M14 12.5h2"></path>
  {%- elif name == "clock" -%}
    <circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path>
  {%- elif name == "arrow-left" -%}
    <path d="M20 12H4"></path><path d="m10 6-6 6 6 6"></path>
  {%- elif name == "arrow-right" -%}
    <path d="M4 12h16"></path><path d="m14 6 6 6-6 6"></path>
  {%- elif name == "chevron-right" -%}
    <path d="m9 5 7 7-7 7"></path>
  {%- elif name == "file" -%}
    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path>
  {%- elif name == "external" -%}
    <path d="M14 4h6v6"></path><path d="M20 4 11 13"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path>
  {%- elif name == "menu" -%}
    <path d="M4 7h16M4 12h16M4 17h16"></path>
  {%- elif name == "close" -%}
    <path d="m6 6 12 12M18 6 6 18"></path>
  {%- elif name == "sun" -%}
    <circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"></path>
  {%- elif name == "moon" -%}
    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"></path>
  {%- elif name == "check" -%}
    <path d="m4 12.5 5 5L20 6.5"></path>
  {%- elif name == "info" -%}
    <circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path>
  {%- elif name == "shield" -%}
    <path d="M12 3 5 6v5c0 4.6 3 8.2 7 10 4-1.8 7-5.4 7-10V6Z"></path><path d="m9 12 2 2 4-4"></path>
  {%- elif name == "mail" -%}
    <rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path>
  {%- elif name == "phone" -%}
    <path d="M7 3h3l2 5-2.5 1.5a12 12 0 0 0 5 5L16 12l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 5 5a2 2 0 0 1 2-2Z"></path>
  {%- elif name == "users" -%}
    <circle cx="9" cy="8" r="3.2"></circle><path d="M3.5 20a5.5 5.5 0 0 1 11 0"></path><path d="M16 5.5a3 3 0 0 1 0 5.6M17.5 14.2A5 5 0 0 1 21 20"></path>
  {%- endif -%}
</svg>
{%- endmacro %}
