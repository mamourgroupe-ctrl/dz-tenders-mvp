{% extends "base.html" %}
{% from "partials/icons.html" import icon %}

{% block title %}{{ title }} — {{ site_name }}{% endblock %}
{% block description %}{{ message }}{% endblock %}

{% block content %}
<div class="container page error-page">
  <div class="error-card">
    <p class="error-code">{{ status_code }}</p>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="empty-actions">
      <a class="button button-primary" href="/">العودة إلى الرئيسية</a>
      <a class="button button-ghost" href="/annonces">كل الإعلانات</a>
    </div>
  </div>
</div>
{% endblock %}
