name: Daily Tenders Scraper

on:
  schedule:
    # يعمل تلقائياً كل يوم الساعة 08:00 صباحاً بتوقيت الجزائر (07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch: # يتيح لك تشغيل السكربت يدوياً بنقرة زر في أي وقت

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl

