name: DZ Tenders Scraper
# هذه المهمة فحص مجدول بلا إرسال. المشروع على runner مؤقت و
# storage/tenders.db غير متتبَّعة في git، فقاعدة البيانات تُنشأ من الصفر في كل
# دورة وتُمحى بعدها؛ أي إرسال هنا يعني إعادة إشعار بكل مناقصة كل يوم. التقرير
# يُرفق كـ artifact بدل إرساله. لا تُضِف أسراراً أو إرسالاً في هذه المهمة.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scraper (dry run)
        run: python test_run.py --dry-run
      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenders-report-${{ github.run_number }}
          path: |
            tenders_results.json
            tenders_results.xlsx
          if-no-files-found: ignore
          retention-days: 7